name: Build and release Windows portable app

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-release:
    if: contains(github.event.head_commit.message, '[release v1.1.0]')
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      PYTHONPATH: "."
      QT_QPA_PLATFORM: "offscreen"

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run lossless export tests
        run: |
          python tests/test_framecraft.py
          python tests/integration_test.py

      - name: Build portable Windows package
        shell: pwsh
        run: .\build_portable.ps1

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $asset = "outputs\FrameCraft-Windows-Portable-v1.1.0.zip"
          if (gh release view v1.1.0 2>$null) {
            $oldAssetId = gh api "repos/${{ github.repository }}/releases/tags/v1.1.0" `
              --jq '.assets[] | select(.name == "-FrameCraft-Windows.zip") | .id'
            if ($oldAssetId) {
              gh api --method DELETE "repos/${{ github.repository }}/releases/assets/$oldAssetId"
            }
            gh release edit v1.1.0 `
              --title "帧影 FrameCraft v1.1.0" `
              --notes-file RELEASE_NOTES.md
            gh release upload v1.1.0 $asset --clobber
          }
          else {
            gh release create v1.1.0 $asset `
              --title "帧影 FrameCraft v1.1.0" `
              --notes-file RELEASE_NOTES.md
          }
